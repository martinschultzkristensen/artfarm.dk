<!DOCTYPE html> 
<html lang="en">
   <head>
     <meta charset="UTF-8">
      <title>Progress Bar – TW cultureWeek</title>
      
      <style>
      .container {
         max-width: 400px; 
         margin: 40vh auto; /* centrer containeren */ 
         padding: 16px; background: #fafafa; /* let baggrund */ 
         border: 1px solid #ddd; border-radius: 8px; 
         position: relative; /* så absolute elementer fungerer */ 
         font-family: sans-serif; } 
      .end-arrow { position: absolute; bottom: -30%; left: 100%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 10px solid #EB66A2; animation: move-arrow-end 2s ease forwards; } 
      .stat-arrow { position: absolute; bottom: 100%; left: 0%; /* start at 0% */ transform: translateX(-50%) rotate(180deg); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 10px solid #EB66A2; animation: move-arrow 1.3s ease forwards; } 
      .text { transform: translateX(-50%) rotate(180deg); position: absolute; top: -8px; } @keyframes move-arrow { from { left: 0%; } to { left: var(--stat-percentage); } } @keyframes move-arrow-end { from { left: 0%; } to { left: 99.5%; } } 
      .stat-bar-border { display: flex; flex-grow: 1; height: 30px; border: 2px solid #EB66A2; border-radius: 4px; overflow: hidden; } 
      .stat-bar-fill { height: 100%; background-image: linear-gradient(to right, #EB66A2, #FC7800, #FCE837); animation: fill-bar 1.3s ease forwards; } @keyframes fill-bar { from { width: 0%; } to { width: var(--stat-percentage); } } 
      .stat-value { min-width: 24px; text-align: right; font-size: 0.875rem; margin-top: 4px; opacity: 0; /* start invisible */ transform: translateY(10px); /* start a bit lower */ animation: fadeUp 0.8s ease forwards; animation-delay: 1.3s; /* optional: wait until bar fills */ } @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      </style> 
      </head> 
      <body>
        
         <div class="container"> 
          <p style="padding: 16px; position: absolute; bottom: 100%; left: 20%; font-size: larger;">Taiwan culture Week 2026!!!</p>
          <div style="--stat-percentage:30.67%; max-width: 400px; margin: 20px; position: relative;">
         <div class="stat-arrow"><p class="text">50.000dkr</p></div> 
         <div class="stat-bar-border"> 
          <div class="stat-bar-fill"></div> 
</div> 
        <div class="end-arrow"></div></div> <div class="stat-value">
          <strong>100% funded<br>Let's Go! 🎉</strong>
        </div> 
      </div> 
    </div> 
  </body> 
  </html>
